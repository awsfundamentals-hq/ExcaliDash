<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=cabinet-grotesk@500,700,800&display=swap"
    />
    <title>AWS Fundamentals Draw</title>
  </head>

  <body>
    <div id="root"></div>
    <script>
      (function () {
        if (
          typeof window.EXCALIDRAW_ASSET_PATH === "string" &&
          window.EXCALIDRAW_ASSET_PATH.length > 0
        )
          return;
        var base = "%BASE_URL%";
        if (base === "%BASE_URL%") base = "/";
        if (base && base[base.length - 1] !== "/") base += "/";
        window.EXCALIDRAW_ASSET_PATH = new URL(
          base || "/",
          window.location.origin,
        ).toString();
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
